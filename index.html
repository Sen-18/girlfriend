<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Best Friends? 🥹</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Pacifico&display=swap');

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    font-family: "DM Sans", sans-serif;
    background:
        radial-gradient(circle at 20% 20%, #ffd9e8 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #e8d8ff 0%, transparent 35%),
        linear-gradient(135deg, #fff4f8, #f7edff);

    color: #7d4264;
}

.container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.card {
    width: min(650px, 100%);
    padding: 45px 25px;
    text-align: center;

    background: rgba(255,255,255,.62);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border: 1px solid rgba(255,255,255,.8);
    border-radius: 35px;

    box-shadow:
        0 25px 80px rgba(150,90,130,.18);

    position: relative;
}

h1 {
    margin: 0 0 35px;

    font-family: "Pacifico", cursive;
    font-size: clamp(35px, 8vw, 65px);
    line-height: 1.2;

    background: linear-gradient(135deg,#ef6197,#a867d8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    filter: drop-shadow(0 5px 12px rgba(200,100,150,.15));
}

.buttons {
    height: 130px;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;

    position: relative;
}

button {
    border: none;
    padding: 17px 30px;

    border-radius: 18px;

    font-family: "DM Sans", sans-serif;
    font-size: 20px;
    font-weight: 800;

    cursor: pointer;

    transition:
        transform .18s ease,
        box-shadow .18s ease;
}

button:hover {
    transform: translateY(-4px);
}

#yes {
    color: white;

    background: linear-gradient(135deg,#ff6f9f,#e84f91);

    box-shadow:
        0 10px 25px rgba(232,79,145,.35);
}

#yes:hover {
    box-shadow:
        0 15px 35px rgba(232,79,145,.45);
}

#no {
    color: #75445c;

    background: #ffd1df;

    box-shadow:
        0 8px 20px rgba(180,100,130,.18);

    position: relative;
}

#message {
    display: none;

    margin-top: 20px;

    font-size: clamp(25px,6vw,42px);
    font-weight: 800;

    color: #d84f88;
}

#videoBox {
    display: none;

    width: min(280px, 75vw);
    aspect-ratio: 1;

    margin: 25px auto 0;

    overflow: hidden;

    border-radius: 28px;

    border: 6px solid white;

    box-shadow:
        0 20px 45px rgba(100,60,100,.2);

    animation: pop .6s ease;
}

#videoBox video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.particle {
    position: fixed;

    top: -60px;

    pointer-events: none;

    z-index: 999;

    animation: fall linear forwards;
}

@keyframes fall {
    to {
        transform:
            translate3d(var(--x),110vh,0)
            rotate(720deg);

        opacity: 0;
    }
}

@keyframes pop {
    0% {
        transform: scale(.5);
        opacity: 0;
    }

    70% {
        transform: scale(1.08);
    }

    100% {
        transform: scale(1);
        opacity: 1;
    }
}

@media(max-width:520px) {

    .card {
        padding: 38px 18px;
        border-radius: 28px;
    }

    .buttons {
        height: 150px;
    }

    button {
        padding: 15px 22px;
        font-size: 18px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="card" id="card">

        <h1 id="title">
            Will You Be My Best Friend? 🥹
        </h1>

        <div class="buttons" id="buttons">

            <button id="yes">
                YES! 💗
            </button>

            <button id="no">
                NO 😭
            </button>

        </div>

        <div id="message">
            YAY!! BEST FRIENDS! 🥹💗
        </div>

        <div id="videoBox">

            <video
                id="video"
                src="cat.mp4"
                playsinline
                muted
                loop>
            </video>

        </div>

    </div>

</div>


<script>

const yes = document.getElementById("yes");
const no = document.getElementById("no");

const buttons = document.getElementById("buttons");
const card = document.getElementById("card");

const title = document.getElementById("title");
const message = document.getElementById("message");

const videoBox = document.getElementById("videoBox");
const video = document.getElementById("video");


let noCount = 0;


/* =========================
   RUNAWAY NO BUTTON
========================= */

function escapeNo() {

    noCount++;

    const maxX = Math.max(
        40,
        buttons.clientWidth / 2 - 70
    );

    const maxY = 55;

    const x =
        (Math.random() * maxX * 2) - maxX;

    const y =
        (Math.random() * maxY * 2) - maxY;

    no.style.transform =
        `translate(${x}px, ${y}px) rotate(${Math.random()*20-10}deg)`;


    const messages = [
        "NO 😭",
        "NOPE 😭",
        "CATCH ME 😂",
        "STILL NO? 😭",
        "TOO SLOW 😂",
        "YOU CAN'T CLICK ME 😭",
        "TRY AGAIN 😂",
        "HAHA NOPE 💀"
    ];

    no.textContent =
        messages[Math.min(noCount, messages.length - 1)];
}


no.addEventListener("mouseenter", escapeNo);

no.addEventListener("touchstart", function(e) {
    e.preventDefault();
    escapeNo();
});

no.addEventListener("click", escapeNo);


/* =========================
   YES BUTTON
========================= */

yes.addEventListener("click", celebrate);


function celebrate() {

    buttons.style.display = "none";

    title.textContent =
        "Best Friends It Is! 🥹💗";

    message.style.display = "block";

    videoBox.style.display = "block";

    card.classList.add("done");


    video.play().catch(() => {});


    createParticles();
}


/* =========================
   FALLING HEARTS + EMOJIS
========================= */

function createParticles() {

    const emojis = [
        "💗",
        "💖",
        "💕",
        "💞",
        "🥹",
        "😊",
        "✨",
        "💫",
        "🌸"
    ];


    for(let i = 0; i < 100; i++) {

        const particle =
            document.createElement("div");

        particle.className = "particle";

        particle.textContent =
            emojis[
                Math.floor(
                    Math.random() * emojis.length
                )
            ];


        particle.style.left =
            Math.random() * 100 + "vw";


        particle.style.fontSize =
            (18 + Math.random() * 25) + "px";


        particle.style.setProperty(
            "--x",
            ((Math.random() * 300) - 150) + "px"
        );


        particle.style.animationDuration =
            (2.5 + Math.random() * 3.5) + "s";


        particle.style.animationDelay =
            Math.random() * 1.5 + "s";


        document.body.appendChild(particle);


        setTimeout(() => {
            particle.remove();
        }, 7000);
    }
}

</script>

</body>
</html>
