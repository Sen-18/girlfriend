<script>
const no=document.getElementById('no'),yes=document.getElementById('yes'),card=document.getElementById('card'),buttons=document.getElementById('buttons');
let escapes=0,done=false;
function moveNo(e){if(done)return;if(e)e.preventDefault();escapes++;const r=buttons.getBoundingClientRect(), w=no.offsetWidth,h=no.offsetHeight;const pad=8;const maxX=Math.max(pad,r.width-w-pad),maxY=70;const x=pad+Math.random()*maxX;const y=(Math.random()*maxY)-maxY/2;no.style.position='absolute';no.style.left=x+'px';no.style.top=y+'px';no.style.transform='rotate('+(Math.random()*10-5)+'deg)';if(escapes>5)no.textContent='STILL NO? 😭';if(escapes>10)no.textContent='CATCH ME 😭';}
no.addEventListener('mouseenter',moveNo);no.addEventListener('touchstart',moveNo,{passive:false});no.addEventListener('click',moveNo);
function particle(){const el=document.createElement('span');el.className='particle';el.textContent=['💗','💖','💕','💞','😊','😄','🥹','✨','💫'][Math.floor(Math.random()*9)];el.style.left=Math.random()*100+'vw';el.style.fontSize=(18+Math.random()*28)+'px';el.style.setProperty('--drift',(Math.random()*220-110)+'px');el.style.animationDuration=(2.5+Math.random()*3.5)+'s';document.body.appendChild(el);setTimeout(()=>el.remove(),6500)}
function celebrate(){done=true;card.classList.add('done');document.getElementById('title').textContent='Best Friends It Is! 🥹💗';document.getElementById('message').style.display='block';document.getElementById('videoBox').style.display='block';document.getElementById('hint').textContent='You made it! 😭✨';for(let i=0;i<90;i++)setTimeout(particle,i*25);const v=document.getElementById('vid');v.play().catch(()=>{})}
